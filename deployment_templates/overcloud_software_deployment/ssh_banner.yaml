
parameter_defaults:
  # this environment file contains tripleo overrides related to the ssh server
  # This disables the PrintMotd option, if MessageOfTheDay is set it will cause it
  # to print twice and thus I have disabled the PrintMotd option in the sshd 
  # configuration override
  SshServerOptions:
    PrintMotd: 'no'

  BannerText: |
    ******************************************************************
    *     Example Labs - RHOSP 17.1.4 Private Cloud Environment      *
    *     This system is for the use of authorized users only.       *
    ******************************************************************
  MessageOfTheDay: ''
